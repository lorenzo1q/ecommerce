<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati — Horlogerie Prestige</title>
    <link rel="stylesheet" href="styleSignIn.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
</head>
<body>

    <div>
        <div>Registrati</div>

        <div>
            <p>Nome</p>
            <input type="text" id="nome" placeholder="Mario">
        </div>
        <div>
            <p>Cognome</p>
            <input type="text" id="cognome" placeholder="Rossi">
        </div>
        <div>
            <p>Indirizzo</p>
            <input type="text" id="indirizzo" placeholder="Via Roma 1, Milano">
        </div>
        <div>
            <p>CAP</p>
            <input type="text" id="cap" placeholder="20100">
        </div>
        <div>
            <p>Email</p>
            <input type="text" id="email" placeholder="mario@esempio.com">
        </div>
        <div>
            <p>Password</p>
            <input type="password" id="password" placeholder="Min. 8 caratteri, A-z, 0-9, simbolo">
        </div>
        <div>
            <input type="button" value="Conferma Registrazione" onclick="controlla()">
            <p id="error"></p>
        </div>
    </div>

</body>

<script>
    function controlla() {
        let flag          = false;
        let flagNome      = false;
        let flagCognome   = false;
        let flagIndirizzo = false;
        let flagCap       = false;
        let flagEmail     = false;
        let flagPsw       = false;

        const nomeTest     = document.getElementById("nome").value;
        const nomeRegex    = /^[A-Za-zÀ-ÖØ-öø-ÿ' -]{2,50}$/;
        if (!nomeRegex.test(nomeTest))         { flag = true; flagNome = true; }

        const cognomeTest  = document.getElementById("cognome").value;
        const cognomeRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ]+(?:[ '-][A-Za-zÀ-ÖØ-öø-ÿ]+)*$/;
        if (!cognomeRegex.test(cognomeTest))   { flag = true; flagCognome = true; }

        const indirizzoTest  = document.getElementById("indirizzo").value;
        const indirizzoRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ0-9\s.,'\/-]{5,100}$/;
        if (!indirizzoRegex.test(indirizzoTest)){ flag = true; flagIndirizzo = true; }

        const capTest  = document.getElementById("cap").value;
        const capRegex = /^\d{5}$/;
        if (!capRegex.test(capTest))           { flag = true; flagCap = true; }

        const emailTest  = document.getElementById("email").value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailTest))       { flag = true; flagEmail = true; }

        const pswTest  = document.getElementById("password").value;
        const pswRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
        if (!pswRegex.test(pswTest))           { flag = true; flagPsw = true; }

        if (flag) {
            let campi = "";
            if (flagNome)      campi += ", nome";
            if (flagCognome)   campi += ", cognome";
            if (flagIndirizzo) campi += ", indirizzo";
            if (flagCap)       campi += ", CAP";
            if (flagEmail)     campi += ", email";
            if (flagPsw)       campi += ", password (min. 8 car., maiuscola, numero, simbolo)";
            document.getElementById("error").innerHTML = "Campi non validi:" + campi;
        } else {
            const errorEl = document.getElementById("error");
            errorEl.innerHTML = "Registrazione completata";
            errorEl.style.color = "#C9A84C";
            uploadToDB();
            setTimeout(() => { window.location.href = "index.html"; }, 2000);
        }

        function uploadToDB() {
            const form = {
                nome:      document.getElementById("nome").value,
                cognome:   document.getElementById("cognome").value,
                indirizzo: document.getElementById("indirizzo").value,
                cap:       document.getElementById("cap").value,
                email:     document.getElementById("email").value,
                psw:       document.getElementById("password").value
            };
            localStorage.removeItem("elenco");
            localStorage.setItem("elenco", JSON.stringify([form]));
        }
    }
</script>

</html>
