<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account — Horlogerie Prestige</title>
    <link rel="stylesheet" href="styleSignIn.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
</head>
<body>

    <div>
        <div>Il tuo Account</div>

        <div>
            <p>Nome</p>
            <div><p id="nomeUtente"></p></div>
        </div>
        <div>
            <p>Cognome</p>
            <div><p id="cognomeUtente"></p></div>
        </div>
        <div>
            <p>Indirizzo</p>
            <div><p id="indirizzoUtente"></p></div>
        </div>
        <div>
            <p>CAP</p>
            <div><p id="capUtente"></p></div>
        </div>
        <div>
            <p>Email</p>
            <div><p id="emailUtente"></p></div>
        </div>
        <div>
            <p>Password</p>
            <div id="mostraPswDiv">
                <p id="pswUtente"></p>
                <input type="button" value="Mostra" id="mostraPswBtn" onclick="mostraPsw()">
            </div>
        </div>
        <div>
            <input type="button" value="Modifica i tuoi dati" onclick="window.location.href='registrazione.html'">
        </div>
        <div>
            <input type="button" value="Torna alla Collezione" onclick="window.location.href='index.html'">
        </div>
    </div>

</body>

<script>
    let elenco = JSON.parse(localStorage.getItem("elenco"));
    let utente = elenco[0];
    let pswVisibile = false;

    document.getElementById("nomeUtente").textContent     = utente.nome;
    document.getElementById("cognomeUtente").textContent  = utente.cognome;
    document.getElementById("indirizzoUtente").textContent = utente.indirizzo;
    document.getElementById("capUtente").textContent      = utente.cap;
    document.getElementById("emailUtente").textContent    = utente.email;
    document.getElementById("pswUtente").textContent      = "••••••••••";

    function mostraPsw() {
        const btn = document.getElementById("mostraPswBtn");
        const pEl = document.getElementById("pswUtente");
        if (!pswVisibile) {
            pEl.textContent = utente.psw;
            btn.value       = "Nascondi";
            pswVisibile     = true;
        } else {
            pEl.textContent = "••••••••••";
            btn.value       = "Mostra";
            pswVisibile     = false;
        }
    }
</script>

</html>
